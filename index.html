<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sinuca Estável Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); border-radius: 12px; overflow: hidden; background: #1b5e20; }
        
        /* Telas de Menu */
        .screen { position: absolute; width: 100%; height: 100%; background: rgba(15, 25, 15, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        h1 { color: #2ecc71; font-size: 3.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #aaa; margin-bottom: 30px; }
        
        /* Seleção de Dificuldade */
        .setup-group { display: flex; gap: 20px; margin-bottom: 40px; }
        .radio-label { background: #222; border: 2px solid #444; padding: 15px 30px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label { background: #2ecc71; color: #111; border-color: #fff; box-shadow: 0 0 15px rgba(46,204,113,0.4); }
        
        .btn { background: #fff; color: #111; border: none; padding: 15px 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        .btn:hover { background: #2ecc71; color: white; transform: scale(1.03); }
        
        /* HUD informativo */
        #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px 25px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        .hud-item { background: rgba(20, 25, 20, 0.85); padding: 8px 18px; border-radius: 6px; border: 1px solid #27ae60; font-size: 1rem; }
        span.val { color: #2ecc71; font-weight: bold; }
        #controls-info { margin-top: 15px; color: #666; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu" class="screen">
            <h1>Sinuca Pro</h1>
            <p class="subtitle">Selecione o nível e clique para jogar</p>
            <div class="setup-group">
                <input type="radio" id="easy" name="difficulty" value="easy" checked>
                <label for="easy" class="radio-label">FÁCIL (Com Linha de Mira)</label>
                
                <input type="radio" id="hard" name="difficulty" value="hard">
                <label for="hard" class="radio-label">DIFÍCIL (Sem Ajuda)</label>
            </div>
            <button class="btn" onclick="startGame()">Iniciar Partida</button>
        </div>

        <div id="victory-screen" class="screen" style="display: none;">
            <h1>Mesa Limpa!</h1>
            <p class="subtitle" id="win-subtitle"></p>
            <button class="btn" onclick="backToMenu()">Jogar Novamente</button>
        </div>

        <div id="hud">
            <div class="hud-item">Modo: <span id="hud-mode" class="val">-</span></div>
            <div class="hud-item">Tacadas: <span id="hud-shots" class="val">0</span></div>
            <div class="hud-item">Bolas Restantes: <span id="hud-balls" class="val">0</span></div>
        </div>

        <canvas id="poolCanvas" width="800" height="600"></canvas>
    </div>

    <div id="controls-info">
        Controles: Mova o <strong>Mouse</strong> para mirar. Clique, **segure e arraste para trás** para dar força, e **solte o clique** para empurrar a bola branca!
    </div>

    <script>
        const canvas = document.getElementById('poolCanvas');
        const ctx = canvas.getContext('2d');

        // Configurações da Mesa Física
        const table = { x: 70, y: 120, width: 660, height: 380, friction: 0.982 };
        const pocketRadius = 18;
        const pockets = [
            {x: table.x, y: table.y}, {x: table.x + table.width/2, y: table.y}, {x: table.x + table.width, y: table.y},
            {x: table.x, y: table.y + table.height}, {x: table.x + table.width/2, y: table.y + table.height}, {x: table.x + table.width, y: table.y + table.height}
        ];

        // Estado do Jogo
        let gameActive = false;
        let difficulty = 'easy';
        let totalShots = 0;
        let balls = [];
        let whiteBall = null;
        const ballRadius = 11;

        // Controle do Taco / Mouse
        let mouse = { x: 0, y: 0 };
        let isDragging = false;
        let dragDistance = 0;
        const maxDrag = 130;

        // Eventos do Mouse corrigidos
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => { 
            if (!gameActive || isMoving()) return; 
            isDragging = true; 
        });

        canvas.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;

            if (dragDistance > 5) {
                let angleToMouse = Math.atan2(mouse.y - whiteBall.y, mouse.x - whiteBall.x);
                let force = (dragDistance / maxDrag) * 22; // Multiplicador de força da tacada
                
                // Aplica a velocidade na direção oposta ao arraste
                whiteBall.vx = -Math.cos(angleToMouse) * force;
                whiteBall.vy = -Math.sin(angleToMouse) * force;
                
                totalShots++;
                document.getElementById('hud-shots').innerText = totalShots;
            }
            dragDistance = 0;
        });

        function startGame() {
            difficulty = document.querySelector('input[name="difficulty"]:checked').value;
            document.getElementById('hud-mode').innerText = difficulty === 'easy' ? 'Fácil' : 'Difícil';
            
            // Correção da ocultação do menu
            document.getElementById('menu').style.display = 'none';
            document.getElementById('victory-screen').style.display = 'none';
            
            totalShots = 0;
            document.getElementById('hud-shots').innerText = totalShots;
            
            initBalls();
            gameActive = true;
            loop();
        }

        function initBalls() {
            balls = [];
            
            // Criar Bola Branca
            whiteBall = { x: table.x + 180, y: table.y + table.height / 2, vx: 0, vy: 0, color: '#ffffff', isWhite: true };
            balls.push(whiteBall);

            // Cores das bolas do triângulo
            let colors = ['#f1c40f', '#2980b9', '#e74c3c', '#8e44ad', '#d35400', '#27ae60', '#c0392b', '#2c3e50', '#f39c12', '#16a085'];
            let startX = table.x + 460;
            let startY = table.y + table.height / 2;
            let ballIdx = 0;

            // Monta triângulo clássico estável de 4 colunas (10 bolas coloridas)
            for (let i = 0; i < 4; i++) {
                let x = startX + (i * ballRadius * 1.8);
                for (let j = 0; j <= i; j++) {
                    let y = startY - (i * ballRadius) + (j * ballRadius * 2);
                    balls.push({
                        x: x, y: y,
                        vx: 0, vy: 0,
                        color: colors[ballIdx % colors.length],
                        isWhite: false
                    });
                    ballIdx++;
                }
            }
            updateHUD();
        }

        function updateHUD() {
            let count = balls.filter(b => !b.isWhite).length;
            document.getElementById('hud-balls').innerText = count;
            return count;
        }

        function isMoving() { 
            return balls.some(b => Math.abs(b.vx) > 0.08 || Math.abs(b.vy) > 0.08); 
        }

        function update() {
            if (!gameActive) return;

            if (isDragging) {
                let dx = mouse.x - whiteBall.x;
                let dy = mouse.y - whiteBall.y;
                dragDistance = Math.min(Math.sqrt(dx*dx + dy*dy), maxDrag);
            }

            // Movimento e colisão com tabelas
            balls.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;
                b.vx *= table.friction;
                b.vy *= table.friction;

                if (Math.abs(b.vx) < 0.05) b.vx = 0;
                if (Math.abs(b.vy) < 0.05) b.vy = 0;

                // Batidas nas bordas
                if (b.x < table.x + ballRadius) { b.x = table.x + ballRadius; b.vx *= -1; }
                if (b.x > table.x + table.width - ballRadius) { b.x = table.x + table.width - ballRadius; b.vx *= -1; }
                if (b.y < table.y + ballRadius) { b.y = table.y + ballRadius; b.vy *= -1; }
                if (b.y > table.y + table.height - ballRadius) { b.y = table.y + table.height - ballRadius; b.vy *= -1; }
            });

            // Colisões físicas precisas bola com bola
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i];
                    let b2 = balls[j];

                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < ballRadius * 2) {
                        let overlap = (ballRadius * 2) - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        
                        b1.x -= nx * overlap * 0.5;
                        b1.y -= ny * overlap * 0.5;
                        b2.x += nx * overlap * 0.5;
                        b2.y += ny * overlap * 0.5;

                        let kx = b1.vx - b2.vx;
                        let ky = b1.vy - b2.vy;
                        let p = nx * kx + ny * ky;

                        b1.vx -= p * nx;
                        b1.vy -= p * ny;
                        b2.vx += p * nx;
                        b2.vy += p * ny;
                    }
                }
            }

            // Validação de bolas encaçapadas
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                let fellIn = pockets.some(p => {
                    let dist = Math.sqrt((b.x - p.x)**2 + (b.y - p.y)**2);
                    return dist < pocketRadius + 2;
                });

                if (fellIn) {
                    if (b.isWhite) {
                        // Reposiciona a branca se cair
                        b.x = table.x + 180;
                        b.y = table.y + table.height / 2;
                        b.vx = 0; b.vy = 0;
                    } else {
                        balls.splice(i, 1);
                        let remaining = updateHUD();
                        
                        if (remaining === 0) {
                            gameActive = false;
                            document.getElementById('win-subtitle').innerText = `Vitória! Você limpou a mesa com ${totalShots} tacadas no modo ${difficulty === 'easy' ? 'Fácil' : 'Difícil'}.`;
                            document.getElementById('victory-screen').style.display = 'flex';
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Borda de madeira
            ctx.fillStyle = '#4a2c11';
            ctx.fillRect(table.x - 22, table.y - 22, table.width + 44, table.height + 44);

            // Pano verde
            ctx.fillStyle = '#1e7e34';
            ctx.fillRect(table.x, table.y, table.width, table.height);

            // Desenhar Caçapas
            ctx.fillStyle = '#0a0a0a';
            pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, pocketRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Linha Guia (Apenas no Modo Fácil)
            if (gameActive && !isMoving() && difficulty === 'easy') {
                let angleToMouse = Math.atan2(mouse.y - whiteBall.y, mouse.x - whiteBall.x);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(whiteBall.x, whiteBall.y);
                ctx.lineTo(whiteBall.x - Math.cos(angleToMouse) * 450, whiteBall.y - Math.sin(angleToMouse) * 450);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Desenhar Bolas na Tela
            balls.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, ballRadius, 0, Math.PI * 2);
                ctx.fill();

                // Ponto de brilho reflexo 3D
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(b.x - 3, b.y - 3, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Desenhar o Taco Físico de Madeira
            if (gameActive && !isMoving()) {
                let angleToMouse = Math.atan2(mouse.y - whiteBall.y, mouse.x - whiteBall.x);
                
                ctx.save();
                ctx.translate(whiteBall.x, whiteBall.y);
                ctx.rotate(angleToMouse);

                // Desenha o corpo cônico do taco recuando com base no arraste do mouse
                ctx.fillStyle = '#f3a661'; // Corpo de madeira marfim
                ctx.fillRect(15 + dragDistance, -2, 140, 4);
                
                ctx.fillStyle = '#513115'; // Empunhadura escura do taco
                ctx.fillRect(155 + dragDistance, -3, 90, 6);
                
                ctx.fillStyle = '#ffffff'; // Sola/Ponta branca do taco
                ctx.fillRect(11 + dragDistance, -1.5, 4, 3);

                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        function backToMenu() {
            document.getElementById('victory-screen').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        // Renderização estática inicial de fundo
        initBalls();
        draw();
    </script>
</body>
</html>
